name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/scripts/**'
      - '.github/workflows/build_push.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Prepare signing key
        run: |
          echo ${{ secrets.KEYSTORE }} | base64 -d > main/signingkey.jks

      - name: Build extensions
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MANGAPLUS_SALT: ${{ secrets.MANGAPLUS_SALT }}
        run: |
          cd main
          ./gradlew assembleRelease

      - name: Clean up CI files
        run: rm main/signingkey.jks

      - name: Collect build artifacts
        run: |
          mkdir -p ~/apk-artifacts
          cd main
          find . -path '*/build/keiyoushi-source-info.json' | while read -r info; do
            builddir=$(dirname "$info")
            dest=~/apk-artifacts/$(echo "$builddir" | tr '/' '_')
            mkdir -p "$dest"
            cp "$info" "$dest/"
            cp -r "$builddir/outputs" "$dest/"
          done

      - name: Checkout repo branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repo
          path: repo

      - name: Publish and deploy repo
        run: |
          cd repo
          pip install protobuf
          # Full rebuild: regenerate everything from scratch (repo.json is static, kept).
          rm -rf apk jar icon index.pb index.min.json
          python ../main/.github/scripts/publish-repo.py
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          # Force-push a single fresh commit so the repo branch keeps no history.
          git checkout --orphan fresh-repo
          git add -A
          git commit -m "Update extensions repo"
          git push -f origin fresh-repo:repo
